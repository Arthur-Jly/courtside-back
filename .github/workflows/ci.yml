name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write   # dorny/test-reporter publie un check run

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - name: Rapport de tests
        uses: dorny/test-reporter@v1
        if: always()   # publié même en échec — on veut voir QUELS tests cassent
        with:
          name: Tests back
          path: junit.xml
          reporter: java-junit
      - name: Artefact JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-back
          path: junit.xml
